<!doctype html><html lang="en"><meta charset="utf-8"><title>Isolated installed Veyvox acceptance</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; connect-src 'self'; style-src 'unsafe-inline'">
<style>body{background:#13131a;color:#eee;font:18px system-ui;padding:48px}</style>
<h1>Installed replacement — synthetic profile only</h1><p id="result">Verifying…</p>
<script>
(async () => {
  const api = window.veyvox ?? window.backspace;
  const config = await (await fetch('/config')).json();
  const report = { phase: config.phase, ok: false };
  try {
    api.rendererReady();
    const seed = config.phase.endsWith('seed');
    if (seed) {
      localStorage.setItem('backspace_token', 'synthetic-session');
      localStorage.setItem('backspace-language', 'auto');
      localStorage.setItem('backspace_instances_synthetic-owner', 'synthetic-peer');
      localStorage.setItem('backspace-interface-scale', JSON.stringify({ state: { scale: 200 }, version: 0 }));
      localStorage.setItem('backspace-juno-preferences', JSON.stringify({ state: { musicVolume: 20, language: 'auto', dubbingLanguage: 'auto' }, version: 0 }));
      document.cookie = 'session=synthetic-session; Max-Age=3600; SameSite=Strict; Path=/';
    }
    const db = await new Promise((resolve, reject) => {
      const request = indexedDB.open('backspace-transfers', 1);
      request.onupgradeneeded = () => { if (!seed) { request.transaction.abort(); return; } request.result.createObjectStore('fs-handles'); };
      request.onsuccess = () => resolve(request.result); request.onerror = () => reject(request.error);
    });
    const pending = await new Promise((resolve, reject) => {
      const transaction = db.transaction('fs-handles', seed ? 'readwrite' : 'readonly');
      const store = transaction.objectStore('fs-handles');
      if (seed) store.put('synthetic-pending', 'rebrand-pending');
      const request = store.get('rebrand-pending');
      transaction.oncomplete = () => resolve(request.result); transaction.onerror = () => reject(transaction.error);
    });
    db.close();
    if (config.enableStartup) await api.setAutoLaunchSettings({ openAtLogin: true, startMinimized: true });
    if (config.disableStartup) await api.setAutoLaunchSettings({ openAtLogin: false, startMinimized: true });
    Object.assign(report, { ok: true, version: await api.getVersion(), token: localStorage.getItem('backspace_token'), language: localStorage.getItem('backspace-language'),
      instances: localStorage.getItem('backspace_instances_synthetic-owner'), scale: JSON.parse(localStorage.getItem('backspace-interface-scale'))?.state?.scale,
      music: JSON.parse(localStorage.getItem('backspace-juno-preferences'))?.state?.musicVolume, pending,
      cookie: document.cookie.split('; ').find(value => value.startsWith('session='))?.slice(8), legacy: !!window.backspace, canonical: !!window.veyvox,
      hidden: document.visibilityState === 'hidden', startup: await api.getAutoLaunchSettings() });
    document.getElementById('result').textContent = 'Synthetic state checked.';
  } catch { report.ok = false; }
  // Wait for the report acknowledgement before the real app's graceful quit.
  // No updater, media, shell navigation or OS preferences are invoked here.
  try { await fetch('/report', { method: 'POST', body: JSON.stringify(report), headers: { 'Content-Type': 'application/json' } }); }
  finally { api?.recoveryAction('quit'); }
})();
</script></html>
