# OSV-Scanner ratchet. Consumed by .github/workflows/security.yml.
#
# The dependency scan blocks on any vulnerability that is NOT listed here, so a
# newly introduced one fails the build. Each entry below is in one of two
# shapes: the fix needs a major upgrade that is its own compatibility decision,
# or no fixed release exists and the package is build-time only. They are
# deferred, not dismissed. The argument for each lives in
# docs/systems/security-scanning.md, section "What is left open, and why".
#
# ignoreUntil is deliberate. A waiver with no expiry is how a backlog becomes
# permanent. When these dates pass the findings come back and block, which
# forces the upgrade decision to be made rather than forgotten.
#
# Removing an entry is the goal. Adding one needs the same written reason.

# postcss-selector-parser 6.1.4 -> 7.1.6. Build-time only: tailwindcss 3 and
# its postcss-nested, both devDependencies of @backspace/web. The parser runs
# while Vite builds the stylesheet and is not in the bundle a browser loads. No
# 6.x release carries the fix and tailwindcss 3 does not accept 7.x, so it is
# gated behind the tailwindcss 4 port in the Dependabot table.
[[IgnoredVulns]]
id = "CVE-2026-104844"
ignoreUntil = 2026-12-01
reason = "postcss-selector-parser 6.1.4, fixed in 7.1.6 only. Build-time only via tailwindcss 3, which does not accept 7.x."

# braces 3.0.3. No fixed release exists: the advisory covers every version
# through 3.0.3, which is the latest. Build-time only: tailwindcss 3 through
# chokidar and micromatch, devDependencies of @backspace/web.
[[IgnoredVulns]]
id = "CVE-2026-93687"
ignoreUntil = 2026-12-01
reason = "braces 3.0.3, no fixed release exists. Build-time only via tailwindcss 3. Does not ship to users."

# sprintf-js 1.1.3. No fixed release exists: the advisory covers every version
# through 1.1.3, which is the latest. Build-time only: electron-builder to
# @electron/get to global-agent to roarr, used to download Electron while
# packaging. Not in the packaged app or the server image.
[[IgnoredVulns]]
id = "CVE-2026-97058"
ignoreUntil = 2026-12-01
reason = "sprintf-js 1.1.3, no fixed release exists. Build-time only via electron-builder. Does not ship to users."
