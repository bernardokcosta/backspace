<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Backspace — Recovery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --primary: #7c6cf6;
      --primary-hover: #6b5ce0;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #13131a;
      color: #efefef;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }
    body { display: flex; flex-direction: column; }

    .titlebar {
      height: 32px;
      min-height: 32px;
      background: #0b0b10;
      -webkit-app-region: drag;
      position: relative;
      z-index: 100;
    }

    .content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 2rem 2rem;
    }

    .container {
      -webkit-app-region: no-drag;
      width: 100%;
      max-width: 480px;
    }

    .card {
      background: #1a1a23;
      border-radius: 8px;
      padding: 2rem;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.24);
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      margin: 0 0 0.5rem 0;
    }

    .hint {
      font-size: 0.875rem;
      color: #a0a0aa;
      margin: 0 0 1.5rem 0;
      line-height: 1.5;
    }

    .check-result {
      font-size: 0.8125rem;
      margin: 0.5rem 0 0 0;
      min-height: 1em;
    }
    .check-result.up-to-date { color: #84cc8b; }
    .check-result.failed { color: #f0a05a; }

    .actions { display: flex; flex-direction: column; gap: 0.5rem; }

    button.action {
      width: 100%;
      padding: 0.625rem 1rem;
      background: #2a2a33;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 6px;
      color: #efefef;
      font-family: inherit;
      font-size: 0.875rem;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    button.action:hover:not(:disabled) { background: #34343f; }
    button.action:disabled { opacity: 0.5; cursor: default; }
    button.action.primary { background: var(--primary); border-color: transparent; }
    button.action.primary:hover { background: var(--primary-hover); }
    button.action.subtle {
      background: transparent;
      color: #a0a0aa;
      border: none;
      padding-top: 0.375rem;
      padding-bottom: 0.375rem;
      font-size: 0.8125rem;
    }
    button.action.subtle:hover { color: #efefef; background: transparent; }

    .divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.06);
      margin: 1.25rem 0;
    }

    details {
      font-size: 0.8125rem;
      color: #a0a0aa;
    }
    details summary {
      cursor: pointer;
      user-select: none;
      padding: 0.25rem 0;
    }
    details pre {
      margin: 0.5rem 0 0 0;
      padding: 0.75rem;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 4px;
      font-size: 0.75rem;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 200px;
      overflow: auto;
    }
  </style>
</head>
<body>
  <div class="titlebar"></div>
  <div class="content">
    <div class="container">
      <div class="card">
        <h1 data-i18n="title">Backspace couldn't load.</h1>
        <p class="hint" id="hint" data-i18n="loading">Loading…</p>

        <div class="actions">
          <button class="action primary" id="btn-reload" data-i18n="reload">Reload</button>
          <button class="action" id="btn-restart" style="display:none" data-i18n="restartToInstall">Restart to Install Update</button>
          <button class="action" id="btn-check" data-i18n="checkForUpdates">Check for Updates</button>
          <p class="check-result" id="check-result"></p>
          <button class="action" id="btn-change" data-i18n="changeInstance">Change Instance</button>
          <button class="action" id="btn-releases" style="display:none" data-i18n="openReleases">Open Releases Page</button>
        </div>

        <div class="divider"></div>

        <details>
          <summary data-i18n="diagnostics">Diagnostic info</summary>
          <pre id="diagnostic">loading…</pre>
        </details>

        <button class="action subtle" id="btn-quit" data-i18n="quit">Quit Backspace</button>
      </div>
    </div>
  </div>

    const languageQuery = new URLSearchParams(window.location.search);
    let language = Object.hasOwn(STRINGS, languageQuery.get('lang')) ? languageQuery.get('lang') : 'en';
    const languagePreference = languageQuery.get('preference') || language;
    const releasedLanguages = new Set((languageQuery.get('released') || Object.keys(STRINGS).join(',')).split(','));
    let languageRequest = 0;
    function t(key, vars) {
      const text = STRINGS[language][key] || STRINGS.en[key] || key;
      return vars ? text.replace(/\{(\w+)\}/g, (m, name) => (name in vars ? vars[name] : m)) : text;
    }

    function hintFor(reasonCode, updateState) {
      if (updateState === 'external') return t('hintExternal');
      if (reasonCode === 'load-failed') return t('hintLoadFailed');
      if (reasonCode === 'render-gone' || reasonCode === 'unresponsive') {
        if (updateState === 'downloaded') return t('hintCrashReady');
        if (updateState === 'available-manual') return t('hintCrashManual');
        if (updateState === 'downloading') return t('hintCrashDownloading');
        return t('hintCrash');
      }
      if (reasonCode === 'renderer-stalled') {
        if (updateState === 'downloaded') return t('hintStalledReady');
        if (updateState === 'available-manual') return t('hintStalledManual');
        if (updateState === 'downloading') return t('hintStalledDownloading');
        return t('hintStalled');
      }
      return t('hintGeneric');
    }

    function checkButtonLabel(updateState) {
      switch (updateState) {
        case 'external': return t('updatesExternal');
        case 'checking': return t('checking');
        case 'downloading': return t('downloading');
        case 'downloaded': return t('updateReady');
        case 'available-manual': return t('updateAvailable');
        case 'error': return t('checkForUpdates');
        case 'idle':
        default: return t('checkForUpdates');
      }
    }

    function checkButtonEnabled(updateState) {
      if (updateState === 'external') return false;
      return updateState !== 'checking'
        && updateState !== 'downloading'
        && updateState !== 'downloaded'
        && updateState !== 'available-manual';
    }

    function checkResultText(lastCheckResult) {
      if (lastCheckResult === 'up-to-date') return t('upToDate');
      if (lastCheckResult === 'failed') return t('checkFailed');
      return '';
    }

    async function getVersion() {
      try {
        if (typeof window.backspace?.getVersion === 'function') {
          return await window.backspace.getVersion();
        }
      } catch {}
      return null;
    }

    let cachedVersion = null;
    let cachedState = null;
    let stateLoadError = null;
    // Populated in init() via Promise.all alongside getRecoveryState.

    function render(state) {
      cachedState = state;
      const reasonCode = state.reason?.code ?? null;
      $('hint').textContent = hintFor(reasonCode, state.updateState);

      // Check for Updates button
      $('btn-check').textContent = checkButtonLabel(state.updateState);
      $('btn-check').disabled = !checkButtonEnabled(state.updateState);
      $('btn-check').style.display = state.updateState === 'external' ? 'none' : '';

      // Restart visibility. Only ever shown when the update is genuinely staged
      // and installable, so this surface can never present a dead button.
      $('btn-restart').style.display = state.updateState === 'downloaded' ? '' : 'none';

      // Open Releases visibility. Shown after a failed update, and on builds
      // that cannot install in place, where downloading is the only real action.
      const manual = state.updateState === 'available-manual';
      $('btn-releases').style.display = (state.updateState === 'error' || manual) ? '' : 'none';
      $('btn-releases').textContent = manual
        ? (state.updateVersion ? t('downloadVersion', { version: state.updateVersion }) : t('downloadUpdate'))
        : t('openReleases');

      // Inline check result
      const cr = $('check-result');
      cr.textContent = checkResultText(state.lastCheckResult);
      cr.className = 'check-result' + (state.lastCheckResult ? ' ' + state.lastCheckResult : '');

      // Diagnostic info
      const lines = [];
      lines.push(t('diagnosticVersion', { value: cachedVersion || t('unknown') }));
      if (state.reason) lines.push(t('diagnosticReason', { code: state.reason.code, detail: state.reason.detail }));
      if (state.updateVersion) lines.push(t('diagnosticUpdate', { value: state.updateVersion }));
      if (state.lastUpdateError) {
        lines.push(t('diagnosticLastError', { message: state.lastUpdateError.message }));
        if (state.lastUpdateError.code) lines.push(t('diagnosticCode', { code: state.lastUpdateError.code }));
      }
      $('diagnostic').textContent = lines.join('\n');
    }

    function applyLanguage(next) {
      language = Object.hasOwn(STRINGS, next) ? next : 'en';
      document.documentElement.lang = language;
      document.documentElement.dir = language === 'ar' ? 'rtl' : 'ltr';
      document.title = t('windowTitle');
      for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = t(el.getAttribute('data-i18n'));
      if (cachedState) render(cachedState);
      else {
        $('diagnostic').textContent = t('loading');
        if (stateLoadError !== null) $('hint').textContent = t('stateLoadFailed', { message: stateLoadError });
        else if (!window.backspace) $('hint').textContent = t('bridgeUnavailable');
      }
    }

    async function refreshLanguage() {
      if (languagePreference !== 'auto' || typeof window.backspace?.getSystemLanguages !== 'function') return;
      const request = ++languageRequest;
      try {
        const tags = await window.backspace.getSystemLanguages();
        if (request !== languageRequest || !Array.isArray(tags) || !tags.every(tag => typeof tag === 'string')) return;
        let next = 'en';
        for (const tag of tags) {
          const base = tag.trim().toLowerCase().split('-')[0];
          const candidate = base === 'no' ? 'nb' : base;
          if (releasedLanguages.has(candidate) && Object.hasOwn(STRINGS, candidate)) { next = candidate; break; }
        }
        applyLanguage(next);
      } catch { /* The initial native query remains usable with an older bridge. */ }
    }
    window.addEventListener('focus', refreshLanguage);
    window.addEventListener('pagehide', () => { languageRequest += 1; });

    function dispatch(action) {
      if (typeof window.backspace?.recoveryAction === 'function') {
        window.backspace.recoveryAction(action);
      }
    }

    $('btn-reload').onclick = () => dispatch('reload');
    $('btn-restart').onclick = () => dispatch('install-update');
    $('btn-check').onclick = () => dispatch('check-update');
    $('btn-change').onclick = () => dispatch('change-instance');
    $('btn-releases').onclick = () => dispatch('open-releases');
    $('btn-quit').onclick = () => dispatch('quit');

    // Cmd/Ctrl+R as keyboard shortcut for Reload
    window.addEventListener('keydown', (e) => {
      const meta = e.metaKey || e.ctrlKey;
      if (meta && e.key.toLowerCase() === 'r') {
        e.preventDefault();
        dispatch('reload');
      }
    });

    async function init() {
      if (!window.backspace) {
        $('hint').textContent = t('bridgeUnavailable');
        return;
      }
      try {
        // Resolve both in parallel so the first render has the version string
        // (otherwise the diagnostic block briefly shows "Version: loading…").
        const [initial, version] = await Promise.all([
          window.backspace.getRecoveryState(),
          getVersion(),
        ]);
        cachedVersion = version;
        render(initial);
      } catch (err) {
        stateLoadError = err && err.message ? err.message : String(err);
        $('hint').textContent = t('stateLoadFailed', { message: stateLoadError });
        return;
      }
      window.backspace.onRecoveryStateChanged((state) => {
        render(state);
      });
    }
    applyLanguage(language);
    init();
    refreshLanguage();
  </script>
