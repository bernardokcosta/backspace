# Dependabot keeps dependencies and CI actions patched. Three ecosystems:
#   - npm      → the pnpm workspace (Dependabot reads pnpm-lock.yaml v9)
#   - github-actions → action version bumps (feeds the SHA-pin comments)
#   - docker   → the Dockerfile base image (FROM node:24-slim, digest-pinned)
#
# NOTE (intentional): there is NO docker entry for docker-compose.yml. It sits
# at the same "/" directory (a second docker entry would collide on
# ecosystem+directory), and Dependabot's docker ecosystem parses Dockerfiles,
# not `image:` refs in compose. The pinned caddy / livekit-server compose images
# are updated MANUALLY — see the maintainer checklist in
# docs/systems/security-scanning.md.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # One grouped PR for routine minor/patch bumps to cut PR noise.
      npm-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # uiohook-napi is pinned by an exact-version pnpm patch
      # (patches/uiohook-napi@1.5.5.patch). A bump makes the patch path stop
      # matching, breaking `pnpm install --frozen-lockfile` in CI and both
      # Docker stages until the patch is regenerated. Bump it by hand.
      - dependency-name: uiohook-napi

      # ---------------------------------------------------------------------
      # Framework majors we have deliberately deferred.
      #
      # Each entry below ignores ONLY `version-update:semver-major`, so minor
      # and patch releases (including security patches) still flow through the
      # npm-minor-patch group as normal. Without these, Dependabot reopens the
      # same major PR every week: closing one only suppresses that exact
      # version pair, and the minor-patch group keeps moving the base version,
      # which makes the next weekly run see a brand-new pair.
      #
      # Each entry records what unblocks it. Do the upgrade as its own PR,
      # then delete the entry. Do not silently widen an entry to dodge a red
      # build.
      #
      # Migrated in 1.12.0 (now on the majors, entries removed): React 19
      # (typed RefObject/useRef migration), Fastify 5 + @fastify/* (trustProxy
      # function, tus 2.x hook shapes), @tus/file-store + @tus/server 2.x as a
      # pair (Web Request hooks), Electron 45 (login-item API rework).
      # ---------------------------------------------------------------------

      # Tailwind stays on 3. Version 4 moves the PostCSS plugin into
      # `@tailwindcss/postcss` and replaces the JS config model that the
      # Aether Drift design system is built on (docs/systems/design-system.md).
      # Unblock: a dedicated PR that ports the theme, the surface/input tiers
      # and globals.css, verified against Backspace-design-prototype.html.
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]

      # TypeScript stays on 5. Version 7 removes the `baseUrl` compiler option
      # (TS5102), which the workspace tsconfigs rely on.
      # Unblock: a PR that migrates every tsconfig off baseUrl first.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

      # @types/node tracks the RUNTIME, not npm's latest. Node 22 is the
      # lowest supported runtime (`engines: node >=22.12`), so types describing
      # a newer Node let code typecheck clean and fail at runtime on it, even
      # though the image itself runs 24.
      #
      # This one is ignored OUTRIGHT, not just for majors, which is the
      # exception to the rule stated above. Dependabot's npm updater resolves
      # one version per dependency across the whole pnpm workspace and cannot
      # express a per-package split, so even a PATCH bump to the server's
      # Node 22 types rewrites every other manifest to match. Nothing catches
      # that: the older types are a subset, so it compiles clean and CI goes
      # green while every newer API others are entitled to use silently
      # becomes a type error.
      # Unblock: whenever a runtime moves, in that same PR, per package.
      - dependency-name: "@types/node"

      # vitest majors stay deferred while @cloudflare/vitest-pool-workers
      # supports `vitest ^4.1.0` only (its peers, plus internal Vitest APIs
      # with no semver guarantee). The two worker packages (removed from this
      # fork) were the only consumers; the app packages run vitest 5.
      # Unblock: when @cloudflare/vitest-pool-workers ships vitest 5 support.
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The base image moves on purpose, not on release. docs/systems/deployment.md
      # sets the policy: stay on the active LTS line (24), move to 26 after it
      # becomes LTS on 2026-10-28, in a PR that also adds a CI leg for it,
      # resolves the multi-arch index digest and confirms better-sqlite3 has a
      # prebuild for the new ABI on both architectures. Odd-numbered lines
      # (25, 27, ...) are Current only and never qualify; node:25-slim also
      # drops corepack, so the deps stage cannot even activate pnpm (#234).
      # Digest refreshes within the pinned line still flow: this ignores majors
      # only.
      # Unblock: the Node 26 PR described above, then delete this entry.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
