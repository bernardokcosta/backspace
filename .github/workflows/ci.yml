name: CI

# Runs the workspace's lint, typecheck, production build, and full test suite on
# every pull request and on pushes to the supported default branches. The stable
# "Build & test" aggregate includes lint, image and Windows native validation.
# master protection also requires the separate enforcing security/CodeQL checks.

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

# A newer commit on the same branch/PR supersedes in-flight runs — cancel the
# stale one so a rapid push sequence doesn't queue redundant CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-sdr:
    name: Windows native capture
    uses: ./.github/workflows/native-sdr-capture.yml

  build-and-test:
    name: Build & test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Node 24 only: the pinned LTS line, what `.nvmrc` selects and what
        # the Docker image runs. (`engines.node` still admits >=22.12, so
        # Node 22 installs keep working; CI just validates the LTS we ship.)
        node-version: [24]

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # source-pairing and historical-fingerprint contract tests

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.3
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      # The desktop postinstall tries to rebuild the native uiohook-napi module.
      # It fails gracefully (|| warn) without X11 dev headers, and nothing in CI
      # needs the native binary — the desktop tests and TS compile are pure JS —
      # so we intentionally skip installing those headers to keep CI fast.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Compiles shared → server → web (each runs tsc; web also runs the Vite
      # production build). This is the typecheck + build gate for those three.
      - name: Build shared, server & web
        run: pnpm build

      # Workbox leaves any file over the precache limit out of the service
      # worker with only a build warning, so the main chunk outgrowing it would
      # silently break offline start. Fails once a precached file passes 90%
      # of the limit. See docs/systems/deployment.md.
      - name: Check precache sizes
        run: node scripts/check-precache-size.mjs

      # Desktop is not part of `pnpm build`; release.yml owns installers.
      # Type-check its source here so desktop TS errors
      # surface on PRs rather than only at release-tag time.
      - name: Typecheck desktop
        run: pnpm --filter @veyvox/desktop build:ts

      # `pnpm build` runs the server's `tsc`, whose tsconfig includes only
      # `src/**/*` — so nothing in packages/server/test is ever type-checked by
      # the steps above. This covers the federation e2e suites and the shared
      # test helpers they boot instances with. See packages/server/tsconfig.e2e.json
      # for why the older test/ files are not in its include yet.
      - name: Typecheck server e2e suites
        run: pnpm --filter @veyvox/server typecheck:e2e

      # Runs every package's `test` script (server, web, desktop) via vitest.
      #
      # This includes the two-instance federation e2e suites
      # (packages/server/test/federation-e2e-*.test.ts), which spawn real server
      # processes on ephemeral ports, peer them over the real HMAC handshake and
      # relay real events between them. Keeping them in this job feeds their
      # result into the required aggregate gate below. They need
      # no Docker, Caddy or LiveKit, and add roughly a minute of wall clock.
      - name: Test
        run: |
          pnpm test:tooling
          pnpm -r test

      - name: Check Flatpak Node SDK references
        run: node flatpak/node-sdk-version.mjs

      - name: Check Flatpak release source pairing
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node flatpak/sources-pairing.mjs "$BASE_SHA" "$HEAD_SHA"

  # ESLint reads sources only, so run it in parallel with compilation/tests.
  # Both results feed the same required aggregate gate.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.3

      # ESLint 10 declares `node: ^20.19 || ^22.13 || >=24`, which excludes
      # this repository's 22.12 floor. Nothing enforces that range: the eslint
      # bin has no version check, pnpm prints no warning without
      # engine-strict, and `pnpm lint` on 22.12.0 exits 0 today. The pin is so
      # CI runs on a version the package says it supports, not because the run
      # would otherwise fail.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  # The container image has its own build graph: the Dockerfile copies files
  # into the builder stage one path at a time, so a build script that starts
  # reading a new path passes every job above and still fails the image. That
  # is how 1.1.0 shipped without an image: the web build gained the
  # localization check under scripts/, and nothing built the Dockerfile until
  # the tag did. Building the amd64 image here (never pushed) closes that gap
  # on every PR. The buildx cache makes an unchanged image a few seconds.
  build-image:
    name: Build container image
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Verify retained Compose identity without starting services
        # Always an explicit synthetic env file: never load an operator's .env.
        run: |
          mkdir "$RUNNER_TEMP/veyvox-compose"
          cp docker-compose.yml "$RUNNER_TEMP/veyvox-compose/docker-compose.yml"
          printf 'JWT_SECRET=synthetic-compose-acceptance-secret-not-for-production\nDOMAIN=instance.example\n' > "$RUNNER_TEMP/veyvox-compose/.env"
          docker compose --project-directory "$RUNNER_TEMP/veyvox-compose" --env-file "$RUNNER_TEMP/veyvox-compose/.env" -f "$RUNNER_TEMP/veyvox-compose/docker-compose.yml" --project-name veyvox-compat config --format json > "$RUNNER_TEMP/veyvox-compose.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const config = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/veyvox-compose.json', 'utf8'));
          assert.equal(config.name, 'veyvox-compat');
          const service = config.services.backspace;
          assert.ok(service);
          assert.equal(service.container_name, 'backspace');
          assert.equal(service.image, 'ghcr.io/bernardokcosta/backspace:latest');
          assert.equal(service.environment.DB_PATH, '/app/data/backspace.db');
          assert.ok(service.volumes.some(mount => mount.target === '/app/data' && mount.type === 'bind' && mount.source.endsWith('/data')));
          assert.ok(!config.services.veyvox);
          console.log('Compose service, image, database and data mount identities verified (no services started).');
          NODE

      - name: Build amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Aggregate gate reporting a single, matrix-independent "Build & test" status.
  # master protection requires this context, while the matrix job above reports
  # per-version contexts (currently "Build & test (Node 24)"). This job
  # keeps the stable required context alive and fails unless every matrix leg
  # succeeded (if: always() so a matrix failure still reports a definitive result
  # instead of leaving the required check pending forever).
  build-and-test-required:
    name: Build & test
    if: always()
    needs: [build-and-test, build-image, lint, native-sdr]
    runs-on: ubuntu-latest
    steps:
      - name: Verify matrix result
        run: |
          if [ "${{ needs.build-and-test.result }}" != "success" ]; then
            echo "Matrix build-and-test did not succeed: ${{ needs.build-and-test.result }}"
            exit 1
          fi
          if [ "${{ needs.build-image.result }}" != "success" ]; then
            echo "Container image build did not succeed: ${{ needs.build-image.result }}"
            exit 1
          fi
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "Lint did not succeed: ${{ needs.lint.result }}"
            exit 1
          fi
          if [ "${{ needs.native-sdr.result }}" != "success" ]; then
            echo "Windows native build/load/package checks did not succeed: ${{ needs.native-sdr.result }}"
            exit 1
          fi
          echo "All matrix legs passed, lint is clean, the image builds and Windows native packages verify."
