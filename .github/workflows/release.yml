name: Release Desktop

on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/release-notes/**'
      - 'scripts/*desktop*release*'
      - 'scripts/verify-desktop-build.mjs'
      - 'packages/desktop/**'
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  native-sdr:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/native-sdr-capture.yml

  build:
    # Build-only matrix: no release writer, no GH_TOKEN, immutable artifacts.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS — universal build (arm64 + x64) on Apple Silicon runner
          - os: macos-latest
            args: --mac --arm64 --x64
            artifact: release-mac
            files: |
              packages/desktop/dist-electron/*-mac-*.dmg
              packages/desktop/dist-electron/*-mac-*.dmg.blockmap
              packages/desktop/dist-electron/latest-mac.yml
          # Windows — x64 + arm64 on x64 runner.
          # Pinned to windows-2022 (VS 2022 / v17): the windows-latest image
          # ships VS "18", which the node-gyp bundled with electron-rebuild
          # cannot detect ("unknown version undefined") when compiling
          # uiohook-napi in postinstall.
          - os: windows-2022
            args: --win --x64 --arm64
            artifact: release-windows
            files: |
              packages/desktop/dist-electron/*-win-*.exe
              packages/desktop/dist-electron/*-win-*.exe.blockmap
              packages/desktop/dist-electron/latest.yml
          # Linux — x64 on x64 runner
          - os: ubuntu-latest
            args: --linux --x64
            artifact: release-linux-x64
            files: |
              packages/desktop/dist-electron/*-linux-x86_64.AppImage
              packages/desktop/dist-electron/*-linux-amd64.deb
              packages/desktop/dist-electron/latest-linux.yml
          # Linux — arm64 on arm64 runner
          - os: ubuntu-24.04-arm
            args: --linux --arm64
            artifact: release-linux-arm64
            files: |
              packages/desktop/dist-electron/*-linux-arm64.AppImage
              packages/desktop/dist-electron/*-linux-arm64.deb
              packages/desktop/dist-electron/latest-linux-arm64.yml

    runs-on: ${{ matrix.os }}

    steps:
      - name: Harden the runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        # Full X11 dev header set required to compile libuiohook (uiohook-napi)
        # from source in postinstall. Derived from the headers its sources
        # include: Xlib/XKB (libx11-dev), XTest+record (libxtst-dev), Intrinsic
        # (libxt-dev), Xrandr (libxrandr-dev), Xinerama (libxinerama-dev),
        # Xlib-xcb (libx11-xcb-dev), XKBrules (libxkbfile-dev), xkbcommon
        # (libxkbcommon-dev, libxkbcommon-x11-dev). Missing libxrandr-dev was
        # the original build failure (Xrandr.h: No such file or directory).
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxtst-dev libxt-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxkbfile-dev \
            libxrandr-dev libxinerama-dev libx11-xcb-dev

      - name: Install fpm for .deb packaging
        if: runner.os == 'Linux'
        # electron-builder bundles an x86_64-only fpm; on the arm64 runner it
        # aborts the .deb target with "cannot execute binary file: Exec format
        # error". Install fpm natively and set USE_SYSTEM_FPM (below) so both
        # arches package their .deb with a host-native fpm. ruby-dev + make are
        # needed for fpm's native gem dependencies.
        run: |
          sudo apt-get install -y ruby ruby-dev build-essential
          sudo gem install --no-document fpm

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.3

      - name: Setup Node.js
        # Matches .nvmrc, the CI matrix's upper leg and the node24 SDK the
        # Flatpak build already packages this same app with. The desktop build
        # toolchain has a Node 22 floor of its own -- @electron/fuses 2 declares
        # `engines: >=22.12.0` -- so this job cannot drop back to 20 without
        # violating it. This is the BUILD Node only; the shipped app runs on
        # Electron's own bundled Node, which this does not touch.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @backspace/shared build

      - name: Compile desktop TypeScript
        working-directory: packages/desktop
        run: pnpm exec tsc

      # afterPack fails closed if either installer lacks its matching addon.
      # R1 also replaces publication with a single validated release writer.
      - name: Build both Windows native capture architectures
        if: runner.os == 'Windows'
        run: |
          node packages/desktop/scripts/build-sdr-capture.mjs --arch x64
          node packages/desktop/scripts/build-sdr-capture.mjs --arch arm64

      - name: Build desktop app without publication
        working-directory: packages/desktop
        run: pnpm exec electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # Use the host-native fpm installed above instead of electron-builder's
          # bundled x86_64 fpm (which can't run on the arm64 runner). No-op on
          # macOS/Windows, which don't build .deb.
          USE_SYSTEM_FPM: "true"

      - name: Verify Electron security fuses
        working-directory: packages/desktop
        shell: bash
        # Backstop for the fuse flip done in scripts/afterPack.js. That hook
        # resolves the Electron binary path *per platform* (Linux reads
        # `packager.executableName`, mac/win read `appInfo.productFilename`),
        # so "it worked on macOS arm64" proves nothing about the other five
        # artifacts this matrix ships — a wrong path there means either a build
        # error or, worse, a binary that quietly ships with the fuses still off.
        # Read the wire back out of every packaged binary and fail the release
        # if any of the three is not in the state afterPack claims to have set.
        # Runs before the signature check below, mirroring afterPack's own
        # order (fuses are flipped, then the bundle is sealed).
        #
        # `npx --no` is deliberate: it runs the @electron/fuses already pinned
        # in this package's devDependencies and hard-fails instead of reaching
        # the registry. A bare `npx` would verify the shipped binaries with
        # whatever version the registry happens to serve, which is exactly the
        # coupling this check must not have: the CLI's "<Fuse> is <State>"
        # lines are parsed below, and afterPack.js flips the fuses using the
        # pinned copy of the same package.
        run: |
          set -euo pipefail

          # Expected artifacts per runner, matching the build matrix above.
          # Listed explicitly rather than globbed: a glob that matches nothing
          # would skip silently, and a check that verifies nothing is worse
          # than no check at all because it still reads as coverage.
          case "$RUNNER_OS" in
            macOS)
              artifacts=(
                "dist-electron/mac/Backspace Fork.app"
                "dist-electron/mac-arm64/Backspace Fork.app"
              )
              ;;
            Windows)
              artifacts=(
                "dist-electron/win-unpacked/Backspace Fork.exe"
                "dist-electron/win-arm64-unpacked/Backspace Fork.exe"
              )
              ;;
            Linux)
              # Was "@backspacedesktop" up to 1.0.2: electron-builder derived the
              # Linux executable from package.json `name` ("@backspace/desktop"),
              # dropping the slash but keeping the leading "@". electron-builder 26
              # validates that name and rejects it outright, so the build now sets
              # linux.executableName explicitly. Keep this path in step with
              # packages/desktop/electron-builder.yml; nothing else couples them.
              if [ "$RUNNER_ARCH" = "ARM64" ]; then
                artifacts=("dist-electron/linux-arm64-unpacked/Backspace Fork")
              else
                artifacts=("dist-electron/linux-unpacked/Backspace Fork")
              fi
              ;;
            *)
              echo "::error::Unknown runner OS '$RUNNER_OS' — no expected artifact list, refusing to pass by default"
              exit 1
              ;;
          esac

          # Fuse name -> required state, exactly as scripts/afterPack.js sets them.
          expected=(
            "RunAsNode=Disabled"
            "EnableNodeCliInspectArguments=Disabled"
            "OnlyLoadAppFromAsar=Enabled"
          )

          esc="$(printf '\033')"
          failed=0

          for artifact in "${artifacts[@]}"; do
            if [ ! -e "$artifact" ]; then
              echo "::error::Expected packaged artifact not found: packages/desktop/$artifact — the fuses for this target were never checked"
              failed=1
              continue
            fi

            echo "==> $artifact"
            # chalk colourises its output on GitHub Actions (it treats
            # GITHUB_ACTIONS as a colour-capable terminal), and the escape
            # codes wrap the very words matched below. FORCE_COLOR=0 turns
            # that off; the sed strips any that survive anyway.
            if ! fuses="$(FORCE_COLOR=0 npx --no @electron/fuses read --app "$artifact" 2>&1 \
                | sed -e "s/${esc}\[[0-9;]*m//g")"; then
              echo "$fuses"
              echo "::error::${artifact}: could not read the Electron fuse wire (output above)"
              failed=1
              continue
            fi
            echo "$fuses"

            for pair in "${expected[@]}"; do
              name="${pair%%=*}"
              want="${pair#*=}"
              got="$(printf '%s\n' "$fuses" \
                | sed -n -E "s/^[[:space:]]*${name} is ([A-Za-z]+)[[:space:]]*\$/\\1/p")"
              if [ -z "$got" ]; then
                echo "::error::${artifact}: fuse ${name} was not reported by @electron/fuses at all (expected ${want})"
                failed=1
              elif [ "$got" != "$want" ]; then
                echo "::error::${artifact}: fuse ${name} is ${got}, expected ${want} — scripts/afterPack.js did not flip this binary"
                failed=1
              fi
            done
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::Electron security fuse verification failed on $RUNNER_OS/$RUNNER_ARCH — do not ship this release."
            exit 1
          fi
          echo "All three Electron security fuses verified on $RUNNER_OS/$RUNNER_ARCH."

      - name: Verify macOS code signature
        if: runner.os == 'macOS'
        working-directory: packages/desktop
        shell: bash
        run: |
          shopt -s nullglob
          apps=(dist-electron/mac*/*.app)
          if [ ${#apps[@]} -eq 0 ]; then
            echo "::error::No packaged .app found under dist-electron/"
            exit 1
          fi
          for app in "${apps[@]}"; do
            codesign --verify --deep --strict --verbose=2 "$app"
          done

      - name: Verify packaged updater publisher and Windows native resources
        env:
          ARTIFACT_GROUP: ${{ matrix.artifact }}
        run: node scripts/verify-desktop-build.mjs --group "$ARTIFACT_GROUP" --directory packages/desktop/dist-electron
        shell: bash

      - name: Upload immutable release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          compression-level: 0

  validate:
    name: Verify complete release candidate without publishing
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: false
      - name: Assemble and verify all platform outputs before any tag or release writer
        run: |
          version="$(node -p 'require("./packages/desktop/package.json").version')"
          node scripts/desktop-release-assets.mjs --directory release-artifacts --version "$version" --assemble release-assets --output release-inventory.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-desktop-assets
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-desktop-inventory
          path: release-inventory.json
          if-no-files-found: error

  publish:
    name: Validate and publish one release
    # PR and manual runs exercise all real builds/aggregation but NEVER write
    # a release. Only the reviewed immutable tag push can reach this job.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build, native-sdr, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Require successful main-branch CI for the exact tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            result="$(gh api "repos/$REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$COMMIT&event=push&per_page=100" --jq '.workflow_runs | map(select(.head_sha == env.COMMIT and (.head_branch == "master" or .head_branch == "main"))) | sort_by(.run_number) | last | [.status, .conclusion] | @tsv')"
            if [ "$result" = $'completed\tsuccess' ]; then exit 0; fi
            if [[ "$result" == completed* ]]; then echo "::error::Required exact-commit CI did not succeed"; exit 1; fi
            echo "Waiting for exact-commit CI (attempt $attempt/90)"
            sleep 20
          done
          echo "::error::No successful exact-commit main-branch CI within the deadline"
          exit 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-desktop-assets
          path: release-assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-desktop-inventory
          path: .
      - name: Select or create the unique draft and retain its id
        id: bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          node scripts/publish-desktop-release.mjs --repository "$REPOSITORY" --tag "$TAG" --commit "$COMMIT" --notes ".github/release-notes/$TAG.md" --prepare --output-id release-id.json
          node --input-type=module -e 'import fs from "node:fs"; const {releaseId}=JSON.parse(fs.readFileSync("release-id.json","utf8")); fs.appendFileSync(process.env.GITHUB_OUTPUT,"release-id="+releaseId+"\n");'
      - name: Upload, verify and publish only that release id
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          RELEASE_ID: ${{ steps.bootstrap.outputs.release-id }}
        run: node scripts/publish-desktop-release.mjs --repository "$REPOSITORY" --tag "$TAG" --commit "$COMMIT" --release-id "$RELEASE_ID" --directory release-assets --inventory release-inventory.json --notes ".github/release-notes/$TAG.md" --publish
